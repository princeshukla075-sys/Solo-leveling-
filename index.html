<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>System: Solo Leveling Overlord</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #020612;
  --panel: #070d1e;
  --panel2: #0c152b;
  --border: rgba(0,210,255,0.22);
  --blue: #00d2ff;
  --blue-glow: rgba(0,210,255,0.35);
  --gold: #ffd700;
  --gold-glow: rgba(255,215,0,0.25);
  --green: #00ff87;
  --red: #ff3366;
  --purple: #bf55ec;
  --text: #f0f5ff;
  --muted: #526b92;
  --font-hud: 'Rajdhani', sans-serif;
  --font-mono: 'Share Tech Mono', monospace;
  --font-title: 'Orbitron', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: var(--font-hud);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  padding-bottom: 80px;
}

.bg-fx { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.bg-fx::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(0,130,255,0.15), transparent 70%),
              radial-gradient(ellipse 60% 40% at 50% 90%, rgba(191,85,236,0.08), transparent 70%);
}
.scan-line {
  position: absolute; top: -100%; left: 0; width: 100%; height: 3px;
  background: linear-gradient(90deg, transparent, rgba(0,210,255,0.2), transparent);
  animation: scan 6s linear infinite;
}
@keyframes scan { to { top: 110%; } }

canvas#particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

/* ─── SYSTEM MODAL DIALOGUES ─── */
#welcomeOverlay {
  position: fixed; inset: 0; z-index: 9999;
  background: #01040a;
  display: flex; align-items: center; justify-content: center;
  padding: 20px; transition: opacity 0.4s ease;
}
.welcome-inner {
  width: 100%; max-width: 430px;
  background: linear-gradient(165deg, #0b152d, #040916);
  border: 2px solid var(--red);
  border-radius: 14px; padding: 30px;
  box-shadow: 0 0 50px rgba(255,51,102,0.2), inset 0 1px 0 rgba(255,255,255,0.05);
}
.alert-banner {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-title); font-size: 0.8rem;
  letter-spacing: 4px; color: var(--red); text-transform: uppercase; margin-bottom: 20px;
  animation: blink 2s ease-in-out infinite;
}
@keyframes blink { 0%,100% { opacity: 0.5; text-shadow: 0 0 5px var(--red); } 50% { opacity: 1; text-shadow: 0 0 15px var(--red); } }
.alert-banner::before, .alert-banner::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--red)); }
.alert-banner::after { transform: scaleX(-1); }

.system-msg { font-size: 1rem; line-height: 1.6; color: #cbd5e1; margin-bottom: 24px; }
.system-msg strong { color: #fff; text-shadow: 0 0 8px var(--blue); }

.field-group { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; color: var(--blue); font-family: var(--font-mono); }
.field input, .field select {
  background: rgba(0,0,0,0.4); border: 1px solid rgba(0,210,255,0.3);
  border-radius: 6px; padding: 10px; color: var(--text);
  font-family: var(--font-hud); font-size: 1rem; transition: all 0.2s;
}
.field input:focus, .field select:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 8px var(--blue-glow); }
.field select option { background: #070d1e; }

/* ─── TOAST NOTIFICATION MATRIX ─── */
#toastContainer { position: fixed; top: 20px; right: 20px; z-index: 8888; display: flex; flex-direction: column; gap: 10px; pointer-events: none; max-width: 320px; }
.toast {
  background: var(--panel2); border-left: 4px solid var(--blue);
  border-radius: 6px; padding: 14px; font-family: var(--font-hud); font-size: 0.95rem;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6); animation: slideIn 0.3s ease, fadeOut 0.4s ease 3.5s forwards; pointer-events: auto;
}
.toast.success { border-color: var(--green); }
.toast.danger { border-color: var(--red); }
.toast.gold { border-color: var(--gold); }
.toast.lvlup { border-color: var(--purple); background: #150926; box-shadow: 0 0 20px rgba(191,85,236,0.2); }
@keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes fadeOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(40px); } }

/* ─── APPLICATION STRUCTURE ─── */
.app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }

/* ─── HUD CONTROL CENTER ─── */
.hud-panel {
  background: linear-gradient(165deg, #091735, #040916);
  border: 2px solid var(--blue); border-radius: 16px; padding: 22px 20px;
  box-shadow: 0 0 25px var(--blue-glow), inset 0 1px 0 rgba(255,255,255,0.05);
  position: relative; overflow: hidden;
}
.hud-corner { position: absolute; width: 12px; height: 12px; border-color: var(--blue); border-style: solid; opacity: 0.7; }
.hud-corner.tl { top: 6px; left: 6px; border-width: 2px 0 0 2px; }
.hud-corner.tr { top: 6px; right: 6px; border-width: 2px 2px 0 0; }
.hud-corner.bl { bottom: 6px; left: 6px; border-width: 0 0 2px 2px; }
.hud-corner.br { bottom: 6px; right: 6px; border-width: 0 2px 2px 0; }

.sys-title { font-family: var(--font-title); font-size: 0.65rem; letter-spacing: 6px; color: var(--blue); text-transform: uppercase; text-align: center; margin-bottom: 4px; text-shadow: 0 0 8px var(--blue); }
.player-line { text-align: center; font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); letter-spacing: 1px; margin-bottom: 12px; }
.level-row { display: flex; align-items: baseline; justify-content: center; gap: 4px; margin-bottom: 14px; }
.lv-label { font-family: var(--font-title); font-size: 0.75rem; color: var(--muted); letter-spacing: 2px; }
#level { font-family: var(--font-title); font-size: 3.2rem; color: var(--blue); line-height: 1; text-shadow: 0 0 20px var(--blue); }
.rank-badge { font-family: var(--font-mono); font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; background: rgba(0,210,255,0.1); border: 1px solid rgba(0,210,255,0.3); color: var(--blue); margin-left: 6px; align-self: center; text-transform: uppercase; }

.bar-block { margin-bottom: 10px; }
.bar-labels { display: flex; justify-content: space-between; font-size: 0.75rem; font-weight: 600; margin-bottom: 4px; font-family: var(--font-mono); }
.bar-track { background: rgba(0,0,0,0.4); border-radius: 4px; height: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
.bar-fill { height: 100%; width: 0%; border-radius: 4px; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); position: relative; }
#hpBar { background: linear-gradient(90deg, #aa0033, var(--red)); box-shadow: 0 0 10px rgba(255,51,102,0.2); }
#expBar { background: linear-gradient(90deg, #0066cc, var(--blue)); box-shadow: 0 0 10px rgba(0,210,255,0.2); }

.gold-row { text-align: center; margin-top: 10px; font-family: var(--font-mono); font-size: 1.1rem; color: var(--gold); text-shadow: 0 0 10px rgba(255,215,0,0.2); }
.gold-amt { font-size: 1.5rem; font-weight: 700; }

.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.stat-cell { background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.04); border-radius: 8px; padding: 10px 6px; text-align: center; transition: all 0.2s; }
.stat-cell:hover { border-color: rgba(0,210,255,0.25); transform: translateY(-2px); }
.stat-val { font-family: var(--font-title); font-size: 1.3rem; color: var(--blue); }
.stat-lbl { font-size: 0.65rem; color: var(--muted); letter-spacing: 2px; font-family: var(--font-mono); margin-top: 2px; font-weight: bold; }
.stat-cell.str .stat-val { color: #ff8c42; text-shadow: 0 0 5px rgba(255,140,66,0.2); }
.stat-cell.int .stat-val { color: #a78bfa; text-shadow: 0 0 5px rgba(167,139,250,0.2); }
.stat-cell.vit .stat-val { color: #34d399; text-shadow: 0 0 5px rgba(52,211,153,0.2); }

/* ─── HOVER BLOCKS & PANELS ─── */
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 16px; box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
.panel-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid rgba(0,210,255,0.12); }
.panel-title { font-family: var(--font-title); font-size: 0.68rem; letter-spacing: 3px; color: var(--blue); text-transform: uppercase; }

/* inventory */
.inv-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.inv-card { background: linear-gradient(135deg, #0c1a36, #050b18); border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; padding: 12px; display: flex; align-items: center; gap: 10px; font-size: 0.85rem; animation: popIn 0.3s ease; }
@keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.inv-icon { font-size: 1.4rem; }
.inv-empty { color: var(--muted); font-size: 0.85rem; padding: 6px; font-family: var(--font-mono); grid-column: span 2; text-align: center; }

/* Responsive Weight Layout */
.weight-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 6px; width: 100%; }
.weight-box { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.weight-box label { font-size: 0.62rem; color: var(--muted); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.weight-box input { background: rgba(0,0,0,0.3); border: 1px solid rgba(0,210,255,0.2); border-radius: 6px; padding: 6px 4px; color: #fff; font-family: var(--font-hud); font-size: 0.9rem; text-align: center; width: 100%; }
.weight-bar-track { background: rgba(0,0,0,0.4); border-radius: 4px; height: 8px; position: relative; margin: 12px 0 6px 0; overflow: hidden; border: 1px solid rgba(255,255,255,0.03); }
.weight-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--purple), var(--blue)); transition: width 0.5s ease; }
.weight-labels { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--muted); font-family: var(--font-mono); }

/* habits */
.habit-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
.habit-item:last-of-type { border-bottom: none; }
.habit-name { font-size: 0.95rem; font-weight: 600; }
.habit-reward { font-size: 0.75rem; margin-top: 2px; font-family: var(--font-mono); }
.habit-btns { display: flex; gap: 8px; }
.hbtn { width: 34px; height: 34px; border-radius: 6px; border: none; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; transition: all 0.1s; }
.hbtn:active { transform: scale(0.9); }
.hbtn.plus { background: rgba(0,255,135,0.12); color: var(--green); border: 1px solid rgba(0,255,135,0.25); }
.hbtn.minus { background: rgba(255,51,102,0.1); color: var(--red); border: 1px solid rgba(255,51,102,0.25); }

/* dailies */
.daily-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.04); transition: opacity 0.2s; }
.daily-item.done { opacity: 0.45; }
.daily-item:last-of-type { border-bottom: none; }
.daily-main { flex: 1; min-width: 0; }
.daily-name { font-size: 0.95rem; font-weight: 600; }
.daily-reward { font-size: 0.72rem; color: var(--green); font-family: var(--font-mono); margin-top: 3px; }
.daily-actions { display: flex; gap: 6px; align-items: center; }

.cb { width: 22px; height: 22px; min-width: 22px; border-radius: 6px; border: 1.5px solid var(--muted); background: rgba(0,0,0,0.3); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; margin-top: 2px; }
.cb.checked { background: var(--blue); border-color: var(--blue); box-shadow: 0 0 10px var(--blue-glow); }
.cb.checked::after { content: ''; width: 5px; height: 9px; border: solid #000; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translateY(-1px); }
.edit-task-btn { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 0.9rem; padding: 4px; transition: color 0.2s; }
.edit-task-btn:hover { color: var(--blue); }

/* ─── SHOP SYSTEMS ─── */
.shop-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.04); gap: 10px; }
.shop-item:last-of-type { border-bottom: none; }
.shop-info { flex: 1; }
.shop-name { font-size: 0.95rem; font-weight: 600; }
.shop-meta { font-size: 0.72rem; color: var(--muted); font-family: var(--font-mono); margin-top: 2px; }
.shop-meta .cost { color: var(--gold); font-weight: bold; }
.shop-meta .req { color: var(--muted); }
.shop-item.owned .shop-name { color: var(--muted); text-decoration: line-through; }
.owned-badge { font-size: 0.65rem; color: var(--green); border: 1px solid rgba(0,255,135,0.3); padding: 3px 8px; border-radius: 4px; font-family: var(--font-mono); letter-spacing: 1px; }

/* ─── CONTAINER MODALS ─── */
.modal-overlay { position: fixed; inset: 0; z-index: 7777; background: rgba(1,4,10,0.9); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; padding: 20px; transition: opacity 0.2s ease; }
.modal-overlay.hidden { display: none; }
.modal { background: linear-gradient(160deg, #0c1832, #040916); border: 1px solid var(--blue); border-radius: 14px; padding: 24px; width: 100%; max-width: 390px; box-shadow: 0 0 35px rgba(0,210,255,0.15); }
.modal h3 { font-family: var(--font-title); font-size: 0.75rem; letter-spacing: 3px; color: var(--blue); margin-bottom: 16px; text-transform: uppercase; }
.modal-btns { display: flex; gap: 8px; margin-top: 16px; }

/* BUTTON ENGINE */
.btn { border: none; border-radius: 8px; cursor: pointer; font-family: var(--font-hud); font-weight: 700; font-size: 0.85rem; letter-spacing: 1.5px; text-transform: uppercase; padding: 12px 16px; width: 100%; transition: all 0.2s; text-align: center; }
.btn:active { transform: scale(0.97); }
.btn-primary { background: linear-gradient(135deg, #005bb7, #00a8ff); color: #fff; box-shadow: 0 4px 15px rgba(0,130,255,0.3); }
.btn-danger { background: linear-gradient(135deg, #990026, #ff3366); color: #fff; box-shadow: 0 4px 15px rgba(255,51,102,0.25); }
.btn-gold { background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 6px 14px; width: auto; font-size: 0.75rem; font-family: var(--font-mono); }
.btn-gold:hover { background: rgba(255,215,0,0.08); }
.btn-sm { padding: 6px 12px; width: auto; font-size: 0.78rem; }
.btn-outline { background: transparent; border: 1px solid rgba(0,210,255,0.3); color: var(--blue); }

.btn-add-task { background: rgba(0,210,255,0.04); border: 1px dashed rgba(0,210,255,0.25); border-radius: 8px; padding: 10px; width: 100%; cursor: pointer; color: var(--muted); font-family: var(--font-hud); font-size: 0.85rem; text-align: center; transition: all 0.2s; margin-top: 8px; }
.btn-add-task:hover { color: var(--blue); border-color: var(--blue); background: rgba(0,210,255,0.08); }

#lvlFlash { position: fixed; inset: 0; z-index: 9000; background: rgba(191,85,236,0.12); pointer-events: none; opacity: 0; }
#lvlFlash.active { animation: lvlFlashAnim 1.2s ease forwards; }
@keyframes lvlFlashAnim { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; } }

.streak-bar { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.streak-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s; }
.streak-dot.lit { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 8px var(--gold-glow); }
.streak-label { font-size: 0.75rem; color: var(--muted); font-family: var(--font-mono); }

/* BOTTOM TAB HUD NAVIGATION */
.tab-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; background: rgba(4,8,18,0.96); backdrop-filter: blur(12px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0 max(10px, env(safe-area-inset-bottom)); }
.tab-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; cursor: pointer; color: var(--muted); font-family: var(--font-hud); font-size: 0.65rem; letter-spacing: 1px; text-transform: uppercase; padding: 4px 16px; transition: color 0.2s; }
.tab-btn .tab-icon { font-size: 1.4rem; transition: transform 0.2s; }
.tab-btn.active { color: var(--blue); text-shadow: 0 0 8px var(--blue-glow); }
.tab-btn.active .tab-icon { transform: scale(1.15); }

.tab-section { display: none; }
.tab-section.active { display: flex; flex-direction: column; gap: 14px; }

.xp-pop { position: fixed; z-index: 5000; pointer-events: none; font-family: var(--font-title); font-size: 1.3rem; color: var(--green); text-shadow: 0 0 12px var(--green); animation: floatUp 1s ease forwards; }
@keyframes floatUp { from { opacity: 1; transform: translateY(0) scale(0.9); } to { opacity: 0; transform: translateY(-70px) scale(1.2); } }

.profile-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,
