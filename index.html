<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System: Solo Leveling</title>
    <style>
        :root {
            --bg-color: #0a0f1d;
            --panel-color: #131a30;
            --accent-blue: #00d2ff;
            --accent-glow: rgba(0, 210, 255, 0.3);
            --text-main: #ffffff;
            --text-muted: #8a99ad;
            --success: #00ff87;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* System Header */
        .header-panel {
            background: linear-gradient(135deg, var(--panel-color), #1a2444);
            border: 2px solid var(--accent-blue);
            box-shadow: 0 0 15px var(--accent-glow);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .system-title {
            font-size: 1.2rem;
            letter-spacing: 4px;
            color: var(--accent-blue);
            margin: 0 0 10px 0;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 0 0 8px var(--accent-blue);
        }

        .level-display {
            font-size: 3rem;
            font-weight: 900;
            margin: 5px 0;
            color: var(--text-main);
        }

        .exp-bar-container {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            height: 12px;
            width: 100%;
            margin-top: 10px;
            overflow: hidden;
            border: 1px solid rgba(0, 210, 255, 0.2);
        }

        .exp-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-blue), #0066ff);
            width: 0%;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px var(--accent-blue);
        }

        .exp-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 5px;
            display: block;
        }

        /* Quest Panel */
        .panel {
            background-color: var(--panel-color);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .panel-title {
            font-size: 1.1rem;
            color: var(--accent-blue);
            margin-top: 0;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(0, 210, 255, 0.2);
            padding-bottom: 5px;
        }

        .quest-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .quest-item:last-child {
            border-bottom: none;
        }

        .quest-details {
            display: flex;
            flex-direction: column;
        }

        .quest-name {
            font-size: 1rem;
            font-weight: 600;
        }

        .quest-reward {
            font-size: 0.75rem;
            color: var(--success);
            margin-top: 2px;
        }

        /* Custom Checkbox Replacement */
        .checkbox-container {
            position: relative;
            cursor: pointer;
            font-size: 22px;
            user-select: none;
            padding-left: 30px;
        }

        .checkbox-container input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }

        .checkmark {
            position: absolute;
            top: 0;
            left: 0;
            height: 24px;
            width: 24px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--text-muted);
            border-radius: 6px;
            transition: all 0.2s;
        }

        .checkbox-container input:checked ~ .checkmark {
            background-color: var(--success);
            border-color: var(--success);
            box-shadow: 0 0 10px rgba(0, 255, 135, 0.4);
        }

        .checkmark:after {
            content: "";
            position: absolute;
            display: none;
            left: 8px;
            top: 4px;
            width: 5px;
            height: 10px;
            border: solid var(--bg-color);
            border-width: 0 3px 3px 0;
            transform: rotate(45deg);
        }

        .checkbox-container input:checked ~ .checkmark:after {
            display: block;
        }

        /* Weight Scale Module */
        .weight-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .weight-input-box {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .weight-input-box label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .weight-input-box input {
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 8px;
            border-radius: 6px;
            font-size: 1rem;
            text-align: center;
        }

        .weight-input-box input:focus {
            border-color: var(--accent-blue);
            outline: none;
        }

        /* Achieving Curve Progress */
        .curve-container {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 15px;
            position: relative;
            text-align: center;
        }

        .curve-track {
            height: 8px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            position: relative;
            margin: 20px 0 10px 0;
            overflow: hidden;
        }

        .curve-progress {
            height: 100%;
            background: linear-gradient(90deg, #ff007b, var(--accent-blue));
            width: 0%;
            transition: width 0.5s ease;
        }

        .curve-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .current-status-txt {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .btn-reset {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-muted);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .btn-reset:hover {
            border-color: var(--accent-blue);
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Status Header -->
        <div class="header-panel">
            <div class="system-title">Active System Status</div>
            <div class="level-display">LV. <span id="level">1</span></div>
            <div class="exp-bar-container">
                <div class="exp-bar" id="expBar"></div>
            </div>
            <span class="exp-text" id="expText">EXP: 0 / 100</span>
        </div>

        <!-- Daily Quests -->
        <div class="panel">
            <div class="panel-title">Daily Quest: Preparation for Greatness</div>
            
            <div class="quest-item">
                <div class="quest-details">
                    <span class="quest-name">10,000 Daily Steps</span>
                    <span class="quest-reward">+15 EXP</span>
                </div>
                <label class="checkbox-container">
                    <input type="checkbox" class="quest-check" data-exp="15" id="q1">
                    <span class="checkmark"></span>
                </label>
            </div>

            <div class="quest-item">
                <div class="quest-details">
                    <span class="quest-name">100 Push-Ups</span>
                    <span class="quest-reward">+15 EXP</span>
                </div>
                <label class="checkbox-container">
                    <input type="checkbox" class="quest-check" data-exp="15" id="q2">
                    <span class="checkmark"></span>
                </label>
            </div>

            <div class="quest-item">
                <div class="quest-details">
                    <span class="quest-name">100 Sit-Ups</span>
                    <span class="quest-reward">+15 EXP</span>
                </div>
                <label class="checkbox-container">
                    <input type="checkbox" class="quest-check" data-exp="15" id="q3">
                    <span class="checkmark"></span>
                </label>
            </div>

            <div class="quest-item">
                <div class="quest-details">
                    <span class="quest-name">100 Crunches / Squats</span>
                    <span class="quest-reward">+15 EXP</span>
                </div>
                <label class="checkbox-container">
                    <input type="checkbox" class="quest-check" data-exp="15" id="q4">
                    <span class="checkmark"></span>
                </label>
            </div>

            <div class="quest-item">
                <div class="quest-details">
                    <span class="quest-name">Intellect Build (2+ Hours Study/Read)</span>
                    <span class="quest-reward">+20 EXP</span>
                </div>
                <label class="checkbox-container">
                    <input type="checkbox" class="quest-check" data-exp="20" id="q5">
                    <span class="checkmark"></span>
                </label>
            </div>
            
            <button class="btn-reset" onclick="resetQuests()">Reset Daily Quests</button>
        </div>

        <!-- Weight Curve Tracker -->
        <div class="panel">
            <div class="panel-title">Weight Target Journey</div>
            <div class="weight-grid">
                <div class="weight-input-box">
                    <label>Start (kg)</label>
                    <input type="number" id="startWeight" value="80" step="0.1" oninput="updateWeightCurve()">
                </div>
                <div class="weight-input-box">
                    <label>Target (kg)</label>
                    <input type="number" id="targetWeight" value="70" step="0.1" oninput="updateWeightCurve()">
                </div>
            </div>
            <div class="weight-input-box" style="margin-bottom: 15px;">
                <label>Current Weight (kg)</label>
                <input type="number" id="currentWeight" value="78" step="0.1" oninput="updateWeightCurve()">
            </div>

            <div class="curve-container">
                <div class="current-status-txt" id="curveStatus">Progress: 0% Completed</div>
                <div class="curve-track">
                    <div class="curve-progress" id="curveProgress"></div>
                </div>
                <div class="curve-labels">
                    <span id="lblStart">80kg</span>
                    <span style="color: var(--accent-blue); font-weight: bold;">Current</span>
                    <span id="lblTarget">70kg</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // State Management variables
        let level = parseInt(localStorage.getItem('sl_level')) || 1;
        let exp = parseInt(localStorage.getItem('sl_exp')) || 0;
        const expNeeded = 100; // EXP required to level up

        // Load initial data on startup
        document.getElementById('level').innerText = level;
        
        // Restore checkbox states from local storage
        const checkboxes = document.querySelectorAll('.quest-check');
        checkboxes.forEach(cb => {
            const savedState = localStorage.getItem('cb_' + cb.id);
            if (savedState === 'true') {
                cb.checked = true;
            }
            
            cb.addEventListener('change', (e) => {
                localStorage.setItem('cb_' + cb.id, cb.checked);
                calculateExp();
            });
        });

        // Load saved weights
        if(localStorage.getItem('sl_startWeight')) document.getElementById('startWeight').value = localStorage.getItem('sl_startWeight');
        if(localStorage.getItem('sl_targetWeight')) document.getElementById('targetWeight').value = localStorage.getItem('sl_targetWeight');
        if(localStorage.getItem('sl_currentWeight')) document.getElementById('currentWeight').value = localStorage.getItem('sl_currentWeight');

        function calculateExp() {
            let currentQuestExp = 0;
            let allCompleted = true;

            checkboxes.forEach(cb => {
                if (cb.checked) {
                    currentQuestExp += parseInt(cb.getAttribute('data-exp'));
                } else {
                    allCompleted = false;
                }
            });

            // Perfection Bonus logic (if all tasks done in 24 hours)
            if (allCompleted && checkboxes.length > 0) {
                currentQuestExp += 20; // 20 Bonus EXP for absolute completion
            }

            // Check if user has gained enough combined points to level up
            // Note: Total static exp + active daily exp
            let totalAvailableExp = exp + currentQuestExp;
            
            // Simple Level up execution loop
            while (totalAvailableExp >= expNeeded) {
                totalAvailableExp -= expNeeded;
                level += 1;
                alert("❗ WARNING: YOU HAVE LEVELED UP! Current Power Tier Raised.");
            }

            document.getElementById('level').innerText = level;
            
            let displayPercent = (totalAvailableExp / expNeeded) * 100;
            document.getElementById('expBar').style.width = displayPercent + "%";
            document.getElementById('expText').innerText = `EXP: ${totalAvailableExp} / ${expNeeded}`;
            
            // Persist base level metrics
            localStorage.setItem('sl_level', level);
        }

        function resetQuests() {
            // Commit active checkbox EXP permanently to baseline before clearing checklist
            let earnedToday = 0;
            let allCompleted = true;
            
            checkboxes.forEach(cb => {
                if (cb.checked) earnedToday += parseInt(cb.getAttribute('data-exp'));
                else allCompleted = false;
            });
            if (allCompleted) earnedToday += 20;

            exp += earnedToday;
            
            while (exp >= expNeeded) {
                exp -= expNeeded;
                level += 1;
            }

            // Save baseline adjustments
            localStorage.setItem('sl_level', level);
            localStorage.setItem('sl_exp', exp);

            // Clean checkboxes layout for new 24 hour cycle
            checkboxes.forEach(cb => {
                cb.checked = false;
                localStorage.removeItem('cb_' + cb.id);
            });

            document.getElementById('level').innerText = level;
            calculateExp();
        }

        function updateWeightCurve() {
            const start = parseFloat(document.getElementById('startWeight').value) || 0;
            const target = parseFloat(document.getElementById('targetWeight').value) || 0;
            const current = parseFloat(document.getElementById('currentWeight').value) || 0;

            // Save settings locally
            localStorage.setItem('sl_startWeight', start);
            localStorage.setItem('sl_targetWeight', target);
            localStorage.setItem('sl_currentWeight', current);

            document.getElementById('lblStart').innerText = start + "kg";
            document.getElementById('lblTarget').innerText = target + "kg";

            let percentage = 0;
            
            // Handles mathematical direction dynamically (Weight Loss vs Weight Gain paths)
            if (start !== target) {
                const totalDistance = target - start;
                const currentDistance = current - start;
                percentage = (currentDistance / totalDistance) * 100;
            }

            // Cap boundaries properly between 0% and 100%
            if (percentage < 0) percentage = 0;
            if (percentage > 100) percentage = 100;

            document.getElementById('curveProgress').style.width = percentage + "%";
            document.getElementById('curveStatus').innerText = `Journey Track: ${percentage.toFixed(1)}% Achieved`;
        }

        // Initialize execution on runtime base
        calculateExp();
        updateWeightCurve();
    </script>
</body>
</html>
